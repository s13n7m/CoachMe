<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SQL Trainer &middot; Consumer Growth</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
<style>
  :root{
    /* PayPal palette */
    --pp-navy:#003087;      /* primary dark blue */
    --pp-blue:#0070ba;      /* primary blue */
    --pp-sky:#009cde;       /* light blue */
    --pp-ink:#001c40;       /* deep text navy */

    --page:#eef3f9;--panel:#ffffff;--panel2:#e7eef7;--line:#d4dfec;
    --text:#0b2b52;--muted:#54708e;--faint:#8ba1b8;
    --accent:var(--pp-blue);--accent-dim:#cfe6f6;
    --good:#0d8a5f;--good-dim:#d5efe3;
    --bad:#c43d2c;--bad-dim:#fadfd9;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--page);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  code{font-family:var(--mono);font-size:0.9em;background:#eaf1f9;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--pp-navy);}

  header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 22px;border-bottom:1px solid var(--line);background:#ffffff;position:sticky;top:0;z-index:10;flex-wrap:wrap;box-shadow:0 1px 4px rgba(0,48,135,0.06);}
  .brand{display:flex;align-items:center;gap:14px;}
  .brand img.logo{height:28px;width:auto;display:block;}
  .brand h1{font-size:18px;font-weight:700;letter-spacing:-0.01em;margin:0;color:var(--pp-navy);}
  .brand .tick{font-family:var(--mono);color:var(--pp-blue);font-size:13px;border:1px solid var(--accent-dim);background:#eaf5fc;padding:1px 8px;border-radius:4px;}
  .brand small{color:var(--muted);font-size:12.5px;}
  .progress{font-family:var(--mono);font-size:13px;color:var(--muted);display:flex;align-items:center;gap:10px;}
  .progress .bar{width:150px;height:7px;border-radius:99px;background:var(--panel2);overflow:hidden;}
  .progress .bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pp-navy),var(--pp-sky));transition:width .35s ease;}
  .progress b{color:var(--pp-navy);font-weight:700;}

  .wrap{display:flex;align-items:stretch;min-height:calc(100vh - 61px);}
  aside{width:290px;flex:0 0 290px;border-right:1px solid var(--line);background:var(--panel);overflow-y:auto;max-height:calc(100vh - 61px);position:sticky;top:61px;}
  .topic{border-bottom:1px solid #e4ebf4;}
  .topic-head{display:flex;align-items:center;gap:8px;padding:11px 16px 7px;}
  .topic-head .tname{font-size:11px;text-transform:uppercase;letter-spacing:0.07em;color:var(--muted);font-weight:700;flex:1;line-height:1.3;}
  .topic-head .frac{font-family:var(--mono);font-size:11px;color:var(--faint);}
  .topic-head .frac.full{color:var(--pp-blue);font-weight:700;}
  .tbar{height:3px;border-radius:99px;background:var(--panel2);margin:0 16px 6px;overflow:hidden;}
  .tbar > i{display:block;height:100%;width:0;background:var(--pp-sky);transition:width .3s;}
  .qbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;color:var(--text);font-family:var(--sans);font-size:13px;padding:6px 16px 6px 16px;cursor:pointer;border-left:2px solid transparent;}
  .qbtn:hover{background:#f0f6fc;}
  .qbtn.active{background:#e9f3fb;border-left-color:var(--pp-blue);}
  .qbtn .dot{width:13px;height:13px;flex:0 0 13px;border-radius:99px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:8px;color:#ffffff;}
  .qbtn.done .dot{background:var(--pp-blue);border-color:var(--pp-blue);}
  .qbtn .lbl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);}
  .qbtn.active .lbl,.qbtn.done .lbl{color:var(--text);}
  .pad{padding-bottom:8px;}

  main{flex:1;min-width:0;padding:22px 24px;max-width:1020px;}
  .qhead{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:12px;}
  .pill{font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);background:#ffffff;}
  .pill.easy{color:var(--good);border-color:#bfe6d4;background:#effaf4;}
  .pill.medium{color:var(--pp-blue);border-color:var(--accent-dim);background:#eaf5fc;}
  .pill.hard{color:var(--bad);border-color:#f0c8bf;background:#fdf1ee;}
  .cleared{margin-left:auto;font-family:var(--mono);font-size:11px;letter-spacing:0.14em;color:var(--pp-blue);border:1px dashed var(--pp-blue);border-radius:4px;padding:2px 10px;transform:rotate(-3deg);opacity:0;transition:opacity .25s;text-transform:uppercase;background:#ffffff;}
  .cleared.show{opacity:1;}

  .readystrip{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:14px;}
  .readystrip .rt{font-size:13px;color:var(--pp-navy);font-weight:700;flex:1;}
  .readystrip .rt small{display:block;color:var(--muted);font-weight:400;font-size:12px;margin-top:1px;}
  .readystrip .rbar{width:120px;height:7px;border-radius:99px;background:var(--panel2);overflow:hidden;}
  .readystrip .rbar > i{display:block;height:100%;width:0;background:var(--pp-blue);transition:width .3s;}
  .rlabel{font-family:var(--mono);font-size:11px;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;background:#ffffff;}
  .rlabel.prep{color:var(--pp-blue);border-color:var(--accent-dim);background:#eaf5fc;}
  .rlabel.ready{color:var(--good);border-color:#bfe6d4;background:#effaf4;}

  .lesson{border:1px solid var(--line);border-radius:8px;background:var(--panel);margin-bottom:16px;overflow:hidden;}
  .lesson-head{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;cursor:pointer;user-select:none;background:#f4f8fc;}
  .lesson-head .lh{font-size:12px;text-transform:uppercase;letter-spacing:0.08em;color:var(--pp-blue);font-weight:700;}
  .lesson-head .chev{color:var(--muted);font-family:var(--mono);font-size:12px;}
  .lesson-body{padding:2px 16px 12px;border-top:1px solid var(--line);}
  .lesson-body p{margin:11px 0;color:#2c4869;font-size:14px;line-height:1.6;}
  .lesson-body p:last-child{color:var(--muted);font-style:italic;}
  .lesson.collapsed .lesson-body{display:none;}

  .ask{border-left:3px solid var(--pp-sky);background:#f0f7fd;border-radius:0 8px 8px 0;padding:10px 14px;margin:0 0 12px;}
  .ask .albl{display:block;font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:0.12em;color:var(--pp-blue);margin-bottom:4px;}
  .ask .atext{font-size:14.5px;line-height:1.5;color:#20406a;font-style:italic;}
  .prompt{font-size:17px;line-height:1.45;margin:6px 0 6px;letter-spacing:-0.005em;color:var(--pp-ink);}
  .prompt .plbl{display:block;font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:0.12em;color:var(--muted);margin-bottom:4px;font-style:normal;}
  .hint{color:var(--muted);font-size:13.5px;margin:0 0 16px;}
  .hint b{color:var(--text);font-weight:600;}

  .editor-wrap{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#00264f;box-shadow:0 2px 8px rgba(0,48,135,0.10);}
  .editor-bar{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;background:#003070;border-bottom:1px solid #0a4a9e;}
  .editor-bar span{font-family:var(--mono);font-size:11.5px;color:#9fc4e8;}
  textarea#sql{width:100%;min-height:150px;resize:vertical;border:none;outline:none;background:#00264f;color:#eaf3fc;font-family:var(--mono);font-size:14px;line-height:1.55;padding:14px;tab-size:2;}

  .actions{display:flex;gap:10px;margin:14px 0;flex-wrap:wrap;}
  button.act{font-family:var(--sans);font-size:14px;font-weight:600;cursor:pointer;border-radius:99px;padding:9px 18px;border:1px solid var(--line);background:#ffffff;color:var(--pp-navy);}
  button.act:hover{border-color:var(--pp-sky);}
  button.run{background:var(--pp-blue);color:#ffffff;border-color:var(--pp-blue);}
  button.run:hover{background:#005ea6;border-color:#005ea6;}
  .kbd{font-family:var(--mono);font-size:11px;color:var(--muted);align-self:center;}

  .verdict{display:none;align-items:flex-start;gap:10px;padding:11px 14px;border-radius:8px;margin:14px 0;font-size:14px;border:1px solid var(--line);}
  .verdict.ok{display:flex;background:var(--good-dim);border-color:#a9dcc4;color:#0a5c40;}
  .verdict.no{display:flex;background:var(--bad-dim);border-color:#eebbae;color:#8f3021;}
  .verdict .ic{font-family:var(--mono);font-weight:700;}

  .results{margin-top:18px;}
  .results h3,.schema h3{font-size:11px;text-transform:uppercase;letter-spacing:0.09em;color:var(--muted);font-weight:700;margin:0 0 8px;}
  .tablescroll{overflow:auto;border:1px solid var(--line);border-radius:8px;max-height:330px;background:#ffffff;}
  table{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:12.5px;}
  th,td{padding:7px 12px;text-align:left;border-bottom:1px solid #e4ebf4;white-space:nowrap;}
  th{background:#e9f3fb;color:var(--pp-navy);position:sticky;top:0;font-weight:700;}
  tr:last-child td{border-bottom:none;}
  td.null{color:var(--faint);font-style:italic;}
  .rowcount{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:8px;}

  .solution{margin-top:16px;border:1px solid var(--line);border-radius:8px;background:#00264f;display:none;}
  .solution.show{display:block;}
  .solution .lbl{padding:8px 12px;border-bottom:1px solid #0a4a9e;font-family:var(--mono);font-size:11.5px;color:#9fc4e8;}
  .solution pre{margin:0;padding:12px 14px;font-family:var(--mono);font-size:13px;color:#dcebfa;overflow:auto;white-space:pre-wrap;}

  .schema-toggle{background:none;border:1px solid #0a4a9e;color:#9fc4e8;border-radius:6px;font-size:12px;padding:5px 10px;cursor:pointer;font-family:var(--mono);}
  .schema{margin-top:26px;border-top:1px solid var(--line);padding-top:18px;}
  .tables{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px;}
  .tbl{border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden;}
  .tbl .name{font-family:var(--mono);font-size:13px;color:var(--pp-blue);padding:8px 12px;border-bottom:1px solid var(--line);background:#f4f8fc;font-weight:700;}
  .tbl ul{list-style:none;margin:0;padding:6px 0;}
  .tbl li{font-family:var(--mono);font-size:12px;color:var(--muted);padding:2px 12px;display:flex;justify-content:space-between;gap:10px;}
  .tbl li b{color:var(--text);font-weight:500;}
  .tbl li .ty{color:var(--faint);}
  .schema .note{color:var(--muted);font-size:12.5px;margin:0 0 14px;}

  .loading{padding:40px 22px;color:var(--muted);font-family:var(--mono);font-size:13px;}

  @media (max-width:860px){
    .wrap{flex-direction:column;}
    aside{width:100%;flex:none;position:static;max-height:210px;border-right:none;border-bottom:1px solid var(--line);}
    main{padding:18px 16px;}
    .progress .bar{width:100px;}
    .brand small{display:none;}
  }
</style>
</head>

const LESSONS = {"SELECT and DISTINCT": "\n<p><b>SELECT</b> is how you ask for columns from a table. <code>SELECT * FROM customers</code> returns every column; naming columns like <code>SELECT first_name, country FROM customers</code> returns just those, in that order.</p>\n<p><b>DISTINCT</b> removes duplicate rows from the result, so <code>SELECT DISTINCT country FROM customers</code> gives one row per country. It applies to the whole row of selected columns, not a single column.</p>\n<p>In the consumer growth role this is the constant first move: pull the right columns from customers, transactions, or events before you shape anything.</p>\n", "Filtering with WHERE": "\n<p><b>WHERE</b> keeps only rows that match a condition. Combine conditions with <code>AND</code> and <code>OR</code>. Useful operators: <code>=</code>, <code>&lt;&gt;</code> (not equal), <code>&gt;</code>, <code>&lt;</code>, <code>BETWEEN a AND b</code>, <code>IN (...)</code>, <code>LIKE 'A%'</code> for text patterns, and <code>IS NULL</code> / <code>IS NOT NULL</code>.</p>\n<p>Text comparisons are case sensitive here, and dates are stored as text in <code>YYYY-MM-DD</code> form, which sorts and compares correctly as text.</p>\n<p>This is how you scope an analysis to a segment, a country, a date range, or a transaction status.</p>\n", "Sorting and limiting": "\n<p><b>ORDER BY</b> sorts the result. Default is ascending; add <code>DESC</code> for descending. You can sort by several columns: <code>ORDER BY amount DESC, transaction_id</code>.</p>\n<p><b>LIMIT n</b> returns only the first n rows after sorting, and <b>OFFSET k</b> skips the first k. So <code>ORDER BY amount DESC LIMIT 5 OFFSET 5</code> returns the 6th through 10th largest.</p>\n<p>Top-N and bottom-N ranking of customers, products, or markets is a daily task when sizing opportunities.</p>\n", "Aggregation and COUNT DISTINCT": "\n<p>Aggregate functions collapse many rows into one value: <code>COUNT(*)</code>, <code>SUM()</code>, <code>AVG()</code>, <code>MIN()</code>, <code>MAX()</code>.</p>\n<p><b>COUNT(DISTINCT col)</b> counts unique values, which is how you get active customers, unique products, or distinct markets rather than raw row counts.</p>\n<p>Wrap results in <code>ROUND(value, 2)</code> to control decimals. Aggregates power every metric you report: revenue, active users, average order value.</p>\n", "GROUP BY": "\n<p><b>GROUP BY</b> splits rows into groups and runs the aggregate once per group. <code>SELECT country, COUNT(*) FROM customers GROUP BY country</code> gives one row per country.</p>\n<p>List several columns to group across dimensions at once: <code>GROUP BY country, segment</code> produces one row per country and segment combination. This multi-dimensional slicing (product by segment by geography) is the backbone of portfolio analysis.</p>\n<p>Every non-aggregated column in the SELECT must appear in the GROUP BY.</p>\n", "HAVING": "\n<p><b>HAVING</b> filters groups after aggregation, the way <code>WHERE</code> filters rows before it. Use it to keep groups that pass an aggregate test.</p>\n<p><code>GROUP BY customer_id HAVING SUM(amount) &gt; 500</code> keeps only high-value customers. You cannot put <code>SUM(amount) &gt; 500</code> in a WHERE clause because the sum does not exist until after grouping.</p>\n<p>This isolates cohorts worth acting on: heavy spenders, high-frequency users, popular products.</p>\n", "CASE expressions": "\n<p><b>CASE</b> is inline if-then logic. <code>CASE WHEN amount &gt;= 200 THEN 'high' ELSE 'low' END</code> returns a value per row.</p>\n<p>Its most powerful use is <b>conditional aggregation</b>: <code>SUM(CASE WHEN status='completed' THEN 1 ELSE 0 END)</code> counts only completed rows inside a wider aggregate. This lets you compute several segmented metrics in a single pass.</p>\n<p>You will reach for this constantly to build funnel counts and labelled buckets.</p>\n", "Joins": "\n<p>A <b>JOIN</b> combines rows from two tables on a matching key. <b>INNER JOIN</b> keeps only rows that match in both. <b>LEFT JOIN</b> keeps every row from the left table and fills nulls where the right has no match.</p>\n<p>The classic use of LEFT JOIN is finding absence: <code>LEFT JOIN transactions ... WHERE transaction_id IS NULL</code> finds customers who never transacted. A <b>self join</b> joins a table to itself, and multi-table joins chain several ON clauses.</p>\n<p>You will join customers, products, transactions, and events to assemble the picture behind any metric.</p>\n", "Subqueries": "\n<p>A <b>subquery</b> is a query nested inside another. A scalar subquery returns one value, useful in WHERE: <code>WHERE amount &gt; (SELECT AVG(amount) FROM transactions)</code>.</p>\n<p><code>IN (SELECT ...)</code> tests membership, and <code>EXISTS (SELECT 1 FROM ... WHERE ...)</code> tests whether any matching row exists, often correlated to the outer row.</p>\n<p>Subqueries express comparisons against a benchmark, which is common when flagging above-average or qualifying customers.</p>\n", "CTEs": "\n<p>A <b>Common Table Expression</b> names a subquery up front with <code>WITH name AS (...)</code>, then references it like a table. It makes multi-step logic readable.</p>\n<p>You can chain several: <code>WITH a AS (...), b AS (SELECT ... FROM a) SELECT ... FROM b</code>. Each step builds on the previous, which is exactly how you would narrate a segmentation or funnel build in an interview.</p>\n<p>Prefer CTEs over deeply nested subqueries when the logic has stages.</p>\n", "Window basics": "\n<p>A <b>window function</b> computes across a set of rows related to the current row, without collapsing them like GROUP BY does. The <code>OVER (...)</code> clause defines the window.</p>\n<p><code>SUM(amount) OVER (ORDER BY txn_date)</code> gives a running total. <code>PARTITION BY customer_id</code> restarts the calculation per customer. <code>SUM(amount) OVER ()</code> with no partition spans everything, handy for share-of-total: <code>amount * 100.0 / SUM(amount) OVER ()</code>.</p>\n<p>Running totals and share-of-total are core to trend and contribution analysis.</p>\n", "Ranking and deduplication": "\n<p><b>ROW_NUMBER()</b> assigns a unique sequential number per window. <b>RANK()</b> and <b>DENSE_RANK()</b> handle ties, RANK leaving gaps and DENSE_RANK not.</p>\n<p>The key pattern is <b>keeping the latest row per group</b>: number rows with <code>ROW_NUMBER() OVER (PARTITION BY customer_id ORDER BY txn_date DESC)</code> then keep where the number is 1. Because you cannot filter a window function in WHERE, wrap it in a CTE first. In warehouses like BigQuery or Snowflake the shorthand is <code>QUALIFY ROW_NUMBER() OVER (...) = 1</code>.</p>\n<p>Deduplication and latest-state logic come up whenever transactional data has repeats.</p>\n", "LAG LEAD and period change": "\n<p><b>LAG(col)</b> looks at a previous row and <b>LEAD(col)</b> at a following row, within the window order. This is how you compare a period to the one before it.</p>\n<p>Month-over-month growth is <code>(rev - LAG(rev) OVER (ORDER BY month)) / LAG(rev) OVER (ORDER BY month)</code>. Guard the division with <code>NULLIF(denominator, 0)</code>. The first row has no prior, so LAG returns null there.</p>\n<p>Period-over-period change is the language of growth reporting.</p>\n", "NTILE and quantile segmentation": "\n<p><b>NTILE(n)</b> splits ordered rows into n roughly equal buckets, so <code>NTILE(4) OVER (ORDER BY total DESC)</code> tags each customer with a spend quartile. <b>PERCENT_RANK()</b> gives a relative standing from 0 to 1.</p>\n<p>These build segmentation frameworks directly: quartiles and quintiles of spend, frequency, or recency. Add a tiebreaker to the ORDER BY (for example <code>ORDER BY total DESC, customer_id</code>) so bucket assignment is stable.</p>\n<p>Behaviourally distinct cohorts often start as quantile cuts like these.</p>\n", "Date and time logic": "\n<p>Dates are text here in <code>YYYY-MM-DD</code>. <code>strftime('%Y-%m', txn_date)</code> truncates to month, the workhorse for monthly trends (the warehouse equivalent is often <code>DATE_TRUNC</code>).</p>\n<p><code>date(signup_date, '+1 month')</code> does date math, and <code>julianday(a) - julianday(b)</code> gives the number of days between two dates. Cast to int with <code>CAST(... AS INT)</code>.</p>\n<p>Cohort windows, time-to-first-payment, and retention periods all rest on this.</p>\n", "Cohort retention": "\n<p>A <b>cohort</b> groups customers by a shared start, usually signup month via <code>strftime('%Y-%m', signup_date)</code>. Retention measures how many of each cohort are still active in later periods.</p>\n<p>The pattern: define each cohort and the month after signup, left join to distinct monthly activity, then divide retained customers by cohort size. Use <code>COUNT(DISTINCT customer_id)</code> on both sides and guard the ratio.</p>\n<p>Retention curves are one of the most requested consumer growth deliverables.</p>\n", "Funnel conversion and rate math": "\n<p>A <b>funnel</b> counts distinct customers reaching each stage: signup, activated, first_payment, repeat_payment. Conditional aggregation gets all stages in one row: <code>COUNT(DISTINCT CASE WHEN event_type='activated' THEN customer_id END)</code>.</p>\n<p>Conversion rates divide one stage by the previous. Always wrap the denominator in <code>NULLIF(x, 0)</code> to avoid divide-by-zero, and multiply by <code>1.0</code> so integer division does not truncate. The <code>FILTER (WHERE ...)</code> clause is a cleaner alternative to CASE inside aggregates.</p>\n<p>Activation, engagement, retention, and monetization rates are the funnel metrics named in the role.</p>\n", "Cross-product attachment": "\n<p><b>Attachment</b> measures how many distinct products a customer uses: <code>COUNT(DISTINCT product_id)</code> per customer. Higher attachment usually means higher retention and value.</p>\n<p>To find customers who use a specific pair, filter to those products then require both: <code>WHERE product_id IN (1,3) GROUP BY customer_id HAVING COUNT(DISTINCT product_id) = 2</code>.</p>\n<p>Quantifying cross-product engagement across the portfolio is central to this team.</p>\n", "Subtotals with ROLLUP": "\n<p>Sometimes you want group rows plus subtotal and grand-total rows in one result. Warehouses offer <code>GROUP BY ROLLUP(...)</code> and <code>GROUPING SETS(...)</code>. SQLite does not, so the portable pattern is <code>UNION ALL</code>: one query for the grouped rows, another for the total.</p>\n<p>You can also stack different groupings (by segment, then by country) into a single labelled result with UNION ALL, which mimics GROUPING SETS.</p>\n<p>Executive summaries often need the breakdown and the total together.</p>\n", "Causal setup treatment and control": "\n<p>Causal methods like difference-in-differences compare a <b>treatment</b> group against a <b>control</b> group, before and after an intervention. The SQL job is building that base cleanly.</p>\n<p>Tag each transaction as pre or post the campaign date with CASE, join to the group assignment, and aggregate into the four cells (group by period). A per-customer pre and post total, plus group label, is the table a diff-in-diff or matching model consumes.</p>\n<p>The modelling is done in Python, but rigorous cohort construction in SQL is what makes it trustworthy.</p>\n"};
const QUESTIONS = [{"topic": "SELECT and DISTINCT", "diff": "easy", "ordered": false, "ask": "Let's warm up. Pull up the full customer table so we can see what we are working with.", "prompt": "Return every column for all rows in the customers table.", "hint": "The simplest query.", "solution": "SELECT * FROM customers;"}, {"topic": "SELECT and DISTINCT", "diff": "easy", "ordered": false, "ask": "I just need a quick directory-style view. Give me each customer's name and the country they are in.", "prompt": "Return only first_name and country from customers.", "hint": "Name the two columns.", "solution": "SELECT first_name, country FROM customers;"}, {"topic": "SELECT and DISTINCT", "diff": "easy", "ordered": false, "ask": "Marketing asks which acquisition channels actually appear in the data. What are the distinct channels?", "prompt": "Return the distinct acquisition channels customers came from.", "hint": "DISTINCT collapses duplicates.", "solution": "SELECT DISTINCT acquisition_channel FROM customers;"}, {"topic": "Filtering with WHERE", "diff": "easy", "ordered": false, "ask": "We are planning a US-focused readout. Pull the customers based in the USA.", "prompt": "Return customer_id and first_name for customers based in the USA.", "hint": "Filter on country.", "solution": "SELECT customer_id, first_name FROM customers WHERE country = 'USA';"}, {"topic": "Filtering with WHERE", "diff": "easy", "ordered": false, "ask": "Finance wants to look at mid-sized payments. Show transactions where the amount sits between 100 and 500.", "prompt": "Return transaction_id and amount for transactions with an amount between 100 and 500 inclusive.", "hint": "BETWEEN a AND b.", "solution": "SELECT transaction_id, amount FROM transactions WHERE amount BETWEEN 100 AND 500;"}, {"topic": "Filtering with WHERE", "diff": "medium", "ordered": false, "ask": "We are sizing a push aimed at consumers we reached through paid and referral. Give me consumer-segment customers who came through Paid or Referral.", "prompt": "Return customer_id and first_name for Consumer-segment customers acquired through Paid or Referral channels.", "hint": "Combine an equality with IN.", "solution": "SELECT customer_id, first_name FROM customers WHERE segment = 'Consumer' AND acquisition_channel IN ('Paid','Referral');"}, {"topic": "Sorting and limiting", "diff": "easy", "ordered": true, "ask": "Leadership always wants the headline numbers first. What are our five largest transactions?", "prompt": "Return transaction_id and amount for the 5 largest transactions, largest first.", "hint": "ORDER BY then LIMIT.", "solution": "SELECT transaction_id, amount FROM transactions ORDER BY amount DESC LIMIT 5;"}, {"topic": "Sorting and limiting", "diff": "easy", "ordered": true, "ask": "For a tenure analysis, who were the first ten customers to join?", "prompt": "Return first_name and signup_date for the 10 earliest-joining customers, earliest first.", "hint": "Ascending is default.", "solution": "SELECT first_name, signup_date FROM customers ORDER BY signup_date ASC, customer_id LIMIT 10;"}, {"topic": "Sorting and limiting", "diff": "medium", "ordered": true, "ask": "We already looked at the top five. Now show me the next five largest, so the sixth through tenth.", "prompt": "Return transaction_id and amount for the 6th through 10th largest transactions.", "hint": "LIMIT with OFFSET.", "solution": "SELECT transaction_id, amount FROM transactions ORDER BY amount DESC, transaction_id LIMIT 5 OFFSET 5;"}, {"topic": "Aggregation and COUNT DISTINCT", "diff": "easy", "ordered": false, "ask": "Quick sanity check before we go further: how many customers are in the base?", "prompt": "Return the total number of customers as customer_count.", "hint": "COUNT(*).", "solution": "SELECT COUNT(*) AS customer_count FROM customers;"}, {"topic": "Aggregation and COUNT DISTINCT", "diff": "easy", "ordered": false, "ask": "For the monetization snapshot, what is the total and the average value of completed transactions?", "prompt": "Return the total and average amount of completed transactions, rounded to 2 decimals, as total_amount and avg_amount.", "hint": "SUM and AVG with a WHERE, wrapped in ROUND.", "solution": "SELECT ROUND(SUM(amount),2) AS total_amount, ROUND(AVG(amount),2) AS avg_amount FROM transactions WHERE status = 'completed';"}, {"topic": "Aggregation and COUNT DISTINCT", "diff": "medium", "ordered": false, "ask": "How many customers are actually active, meaning they have transacted at least once?", "prompt": "Return the number of distinct customers who have made at least one transaction, as active_customers.", "hint": "COUNT(DISTINCT ...).", "solution": "SELECT COUNT(DISTINCT customer_id) AS active_customers FROM transactions;"}, {"topic": "GROUP BY", "diff": "medium", "ordered": false, "ask": "Product wants revenue split by product. Sum the amount for each one.", "prompt": "Return product_id and total_amount: the summed amount per product, rounded to 2 decimals.", "hint": "Group by product_id.", "solution": "SELECT product_id, ROUND(SUM(amount),2) AS total_amount FROM transactions GROUP BY product_id;"}, {"topic": "GROUP BY", "diff": "medium", "ordered": false, "ask": "Give me a customer count broken out by country and segment, so we can see where each segment concentrates.", "prompt": "Return country, segment and customer_count: the number of customers in each country and segment combination.", "hint": "Group by two columns.", "solution": "SELECT country, segment, COUNT(*) AS customer_count FROM customers GROUP BY country, segment;"}, {"topic": "GROUP BY", "diff": "medium", "ordered": false, "ask": "For a value analysis, per customer, how many completed transactions do they have and what is their completed revenue?", "prompt": "Return customer_id, txns and revenue: the count and rounded total amount of each customer's completed transactions.", "hint": "Filter to completed, then group.", "solution": "SELECT customer_id, COUNT(*) AS txns, ROUND(SUM(amount),2) AS revenue FROM transactions WHERE status='completed' GROUP BY customer_id;"}, {"topic": "HAVING", "diff": "medium", "ordered": false, "ask": "Which are our biggest markets? Show the countries with at least eleven customers.", "prompt": "Return country and customer_count for countries with 11 or more customers.", "hint": "HAVING filters after grouping.", "solution": "SELECT country, COUNT(*) AS customer_count FROM customers GROUP BY country HAVING COUNT(*) >= 11;"}, {"topic": "HAVING", "diff": "medium", "ordered": false, "ask": "We want to define a high-value group. Who has spent more than 500 in total?", "prompt": "Return customer_id and total_amount for customers whose total transacted amount exceeds 500, rounded to 2 decimals.", "hint": "HAVING SUM(amount) > 500.", "solution": "SELECT customer_id, ROUND(SUM(amount),2) AS total_amount FROM transactions GROUP BY customer_id HAVING SUM(amount) > 500;"}, {"topic": "HAVING", "diff": "medium", "ordered": false, "ask": "Which products are really getting used? Show the ones with more than thirty transactions.", "prompt": "Return product_id and txn_count for products with more than 30 transactions.", "hint": "Count then filter the count.", "solution": "SELECT product_id, COUNT(*) AS txn_count FROM transactions GROUP BY product_id HAVING COUNT(*) > 30;"}, {"topic": "CASE expressions", "diff": "easy", "ordered": false, "ask": "Tag each transaction as high or low value using 200 as the cutoff, so we can bucket them.", "prompt": "Return transaction_id, amount and a size column that is 'high' when amount is 200 or more, otherwise 'low'.", "hint": "CASE WHEN ... THEN ... ELSE ... END.", "solution": "SELECT transaction_id, amount, CASE WHEN amount >= 200 THEN 'high' ELSE 'low' END AS size FROM transactions;"}, {"topic": "CASE expressions", "diff": "medium", "ordered": false, "ask": "Map each customer to a simple tier: top for Enterprise, mid for SMB, base for everyone else.", "prompt": "Return first_name and tier: 'top' for Enterprise, 'mid' for SMB, 'base' otherwise.", "hint": "Multiple WHEN branches.", "solution": "SELECT first_name, CASE WHEN segment='Enterprise' THEN 'top' WHEN segment='SMB' THEN 'mid' ELSE 'base' END AS tier FROM customers;"}, {"topic": "CASE expressions", "diff": "hard", "ordered": false, "ask": "For a reliability view, per customer, how many of their transactions completed versus failed?", "prompt": "Return customer_id, completed and failed: per customer, the count of completed and failed transactions using conditional aggregation.", "hint": "SUM(CASE WHEN ... THEN 1 ELSE 0 END).", "solution": "SELECT customer_id, SUM(CASE WHEN status='completed' THEN 1 ELSE 0 END) AS completed, SUM(CASE WHEN status='failed' THEN 1 ELSE 0 END) AS failed FROM transactions GROUP BY customer_id;"}, {"topic": "Joins", "diff": "medium", "ordered": false, "ask": "The transactions table only stores product ids. Bring in the readable product name next to each transaction and its amount.", "prompt": "Return transaction_id, product_name and amount by joining transactions to products.", "hint": "INNER JOIN on product_id.", "solution": "SELECT t.transaction_id, p.product_name, t.amount FROM transactions t JOIN products p ON t.product_id=p.product_id;"}, {"topic": "Joins", "diff": "medium", "ordered": false, "ask": "Same revenue-by-product view, but leadership wants the product names, not the ids.", "prompt": "Return product_name and total_amount: rounded total revenue per product name.", "hint": "Join then group by product_name.", "solution": "SELECT p.product_name, ROUND(SUM(t.amount),2) AS total_amount FROM transactions t JOIN products p ON t.product_id=p.product_id GROUP BY p.product_name;"}, {"topic": "Joins", "diff": "hard", "ordered": false, "ask": "We suspect some people signed up and never transacted. Find the customers with no transactions at all.", "prompt": "Return customer_id and first_name for customers who have never made a transaction.", "hint": "LEFT JOIN and keep null matches.", "solution": "SELECT c.customer_id, c.first_name FROM customers c LEFT JOIN transactions t ON c.customer_id=t.customer_id WHERE t.transaction_id IS NULL;"}, {"topic": "Subqueries", "diff": "medium", "ordered": false, "ask": "Which transactions are above the average transaction size? We want to look at the larger-than-typical payments.", "prompt": "Return transaction_id and amount for transactions above the overall average transaction amount.", "hint": "Scalar subquery in WHERE.", "solution": "SELECT transaction_id, amount FROM transactions WHERE amount > (SELECT AVG(amount) FROM transactions);"}, {"topic": "Subqueries", "diff": "medium", "ordered": false, "ask": "Risk flagged refunds this week. Which customers have had at least one refunded transaction?", "prompt": "Return customer_id and first_name for customers who have at least one refunded transaction.", "hint": "IN with a subquery.", "solution": "SELECT customer_id, first_name FROM customers WHERE customer_id IN (SELECT customer_id FROM transactions WHERE status='refunded');"}, {"topic": "Subqueries", "diff": "hard", "ordered": false, "ask": "Show me the customers who have made at least one payment above 300.", "prompt": "Return customer_id and first_name for customers who have any transaction above 300.", "hint": "EXISTS correlated to the customer.", "solution": "SELECT customer_id, first_name FROM customers c WHERE EXISTS (SELECT 1 FROM transactions t WHERE t.customer_id=c.customer_id AND t.amount>300);"}, {"topic": "CTEs", "diff": "medium", "ordered": false, "ask": "Define our top spenders as anyone over 800 in total, and write it as a clean multi-step query so it is easy to follow.", "prompt": "Using a CTE of each customer's total spend, return customer_id and total_amount for customers who spent more than 800, rounded to 2 decimals.", "hint": "WITH spend AS (...) SELECT ... WHERE.", "solution": "WITH spend AS (SELECT customer_id, SUM(amount) AS total FROM transactions GROUP BY customer_id) SELECT customer_id, ROUND(total,2) AS total_amount FROM spend WHERE total > 800;"}, {"topic": "CTEs", "diff": "hard", "ordered": false, "ask": "Instead of a fixed cutoff, show customers who spend more than the average customer. Talk me through it in steps.", "prompt": "Using CTEs, return customer_id and total_amount for customers whose total spend is above the average customer total spend, rounded to 2 decimals.", "hint": "One CTE for per-customer totals, compare to their average.", "solution": "WITH spend AS (SELECT customer_id, SUM(amount) AS total FROM transactions GROUP BY customer_id) SELECT customer_id, ROUND(total,2) AS total_amount FROM spend WHERE total > (SELECT AVG(total) FROM spend);"}, {"topic": "CTEs", "diff": "medium", "ordered": true, "ask": "Give me revenue by month. I want to see how the trend moves over time.", "prompt": "Using a CTE, return mth and revenue: monthly total revenue rounded to 2 decimals, ordered by month.", "hint": "strftime for month inside the CTE.", "solution": "WITH m AS (SELECT strftime('%Y-%m', txn_date) AS mth, SUM(amount) AS rev FROM transactions GROUP BY 1) SELECT mth, ROUND(rev,2) AS revenue FROM m ORDER BY mth;"}, {"topic": "Window basics", "diff": "hard", "ordered": true, "ask": "Build a cumulative revenue line over time, so each row shows revenue to date.", "prompt": "Return txn_date, amount and running_total: a cumulative sum of amount ordered by txn_date then transaction_id.", "hint": "SUM(amount) OVER (ORDER BY ...).", "solution": "SELECT txn_date, amount, ROUND(SUM(amount) OVER (ORDER BY txn_date, transaction_id),2) AS running_total FROM transactions;"}, {"topic": "Window basics", "diff": "hard", "ordered": false, "ask": "For a contribution chart, show each product's revenue and what percent of total revenue it represents.", "prompt": "Return product_id, revenue and pct_of_total: each product's rounded revenue and its percent share of total revenue, rounded to 2 decimals.", "hint": "SUM(SUM(amount)) OVER () gives the grand total.", "solution": "SELECT product_id, ROUND(SUM(amount),2) AS revenue, ROUND(SUM(amount)*100.0/SUM(SUM(amount)) OVER (),2) AS pct_of_total FROM transactions GROUP BY product_id;"}, {"topic": "Window basics", "diff": "medium", "ordered": false, "ask": "For each transaction, put that customer's own average transaction size right next to it, so we can see how each payment compares.", "prompt": "Return customer_id, transaction_id, amount and cust_avg: each transaction alongside that customer's average transaction amount, rounded to 2 decimals.", "hint": "AVG(amount) OVER (PARTITION BY customer_id).", "solution": "SELECT customer_id, transaction_id, amount, ROUND(AVG(amount) OVER (PARTITION BY customer_id),2) AS cust_avg FROM transactions;"}, {"topic": "Ranking and deduplication", "diff": "hard", "ordered": false, "ask": "Rank our customers by total spend, highest first. This feeds a top-accounts list.", "prompt": "Return customer_id, total_amount and rnk: customers ranked by total spend from highest to lowest using RANK. Round total to 2 decimals.", "hint": "RANK() OVER (ORDER BY SUM(amount) DESC).", "solution": "SELECT customer_id, ROUND(SUM(amount),2) AS total_amount, RANK() OVER (ORDER BY SUM(amount) DESC) AS rnk FROM transactions GROUP BY customer_id;"}, {"topic": "Ranking and deduplication", "diff": "hard", "ordered": false, "ask": "Rank the products by revenue, and use a dense ranking so tied products do not leave gaps in the numbers.", "prompt": "Return product_id, revenue and rnk: products ranked by revenue high to low using DENSE_RANK. Round revenue to 2 decimals.", "hint": "DENSE_RANK leaves no gaps on ties.", "solution": "SELECT product_id, ROUND(SUM(amount),2) AS revenue, DENSE_RANK() OVER (ORDER BY SUM(amount) DESC) AS rnk FROM transactions GROUP BY product_id;"}, {"topic": "Ranking and deduplication", "diff": "hard", "ordered": false, "ask": "For a recency view, give me just the single most recent transaction for each customer.", "prompt": "Return customer_id, transaction_id, txn_date and amount for each customer's single most recent transaction (latest txn_date, breaking ties by highest transaction_id).", "hint": "Number rows per customer with ROW_NUMBER, keep number 1, using a CTE.", "solution": "WITH r AS (SELECT customer_id, transaction_id, txn_date, amount, ROW_NUMBER() OVER (PARTITION BY customer_id ORDER BY txn_date DESC, transaction_id DESC) AS rn FROM transactions) SELECT customer_id, transaction_id, txn_date, amount FROM r WHERE rn=1;"}, {"topic": "LAG LEAD and period change", "diff": "hard", "ordered": true, "ask": "For the monthly trend, put last month's revenue next to each month so we can compare side by side.", "prompt": "Return mth, revenue and prev_revenue: monthly revenue and the previous month's revenue, both rounded to 2 decimals, ordered by month.", "hint": "LAG(rev) OVER (ORDER BY mth) in a CTE.", "solution": "WITH m AS (SELECT strftime('%Y-%m', txn_date) AS mth, SUM(amount) AS rev FROM transactions GROUP BY 1) SELECT mth, ROUND(rev,2) AS revenue, ROUND(LAG(rev) OVER (ORDER BY mth),2) AS prev_revenue FROM m ORDER BY mth;"}, {"topic": "LAG LEAD and period change", "diff": "hard", "ordered": true, "ask": "Now turn that into month-over-month growth as a percentage. This is the number leadership asks for in every review.", "prompt": "Return mth and mom_growth_pct: month-over-month revenue growth as a percentage rounded to 2 decimals, ordered by month. The first month is null.", "hint": "(rev - LAG(rev)) * 100 / NULLIF(LAG(rev),0).", "solution": "WITH m AS (SELECT strftime('%Y-%m', txn_date) AS mth, SUM(amount) AS rev FROM transactions GROUP BY 1) SELECT mth, ROUND((rev - LAG(rev) OVER (ORDER BY mth)) * 100.0 / NULLIF(LAG(rev) OVER (ORDER BY mth),0),2) AS mom_growth_pct FROM m ORDER BY mth;"}, {"topic": "LAG LEAD and period change", "diff": "hard", "ordered": false, "ask": "For a gap analysis, for each transaction show when that customer next transacted.", "prompt": "Return customer_id, txn_date and next_txn_date: for each transaction, the date of that customer's next transaction, or null if none.", "hint": "LEAD(txn_date) OVER (PARTITION BY customer_id ORDER BY ...).", "solution": "SELECT customer_id, txn_date, LEAD(txn_date) OVER (PARTITION BY customer_id ORDER BY txn_date, transaction_id) AS next_txn_date FROM transactions;"}, {"topic": "NTILE and quantile segmentation", "diff": "hard", "ordered": false, "ask": "We want to segment customers into spend quartiles. Assign each one a quartile, with one being the highest spenders.", "prompt": "Return customer_id, total and quartile: each customer's rounded total spend and their spend quartile (1 = highest), using NTILE(4).", "hint": "NTILE(4) OVER (ORDER BY total DESC, customer_id) in a CTE.", "solution": "WITH s AS (SELECT customer_id, SUM(amount) AS total FROM transactions GROUP BY customer_id) SELECT customer_id, ROUND(total,2) AS total, NTILE(4) OVER (ORDER BY total DESC, customer_id) AS quartile FROM s;"}, {"topic": "NTILE and quantile segmentation", "diff": "hard", "ordered": false, "ask": "Give each customer a percentile standing by spend, so we can say where a given customer sits in the distribution.", "prompt": "Return customer_id, total and pct_rank: each customer's rounded total spend and PERCENT_RANK by spend ascending, rounded to 4 decimals.", "hint": "PERCENT_RANK() OVER (ORDER BY total).", "solution": "WITH s AS (SELECT customer_id, SUM(amount) AS total FROM transactions GROUP BY customer_id) SELECT customer_id, ROUND(total,2) AS total, ROUND(PERCENT_RANK() OVER (ORDER BY total),4) AS pct_rank FROM s;"}, {"topic": "NTILE and quantile segmentation", "diff": "hard", "ordered": false, "ask": "Marketing wants to target our highest-value fifth. Pull just the top spend quintile of customers.", "prompt": "Return customer_id and total for the top spend quintile only (highest fifth of spenders), rounded to 2 decimals. Use NTILE(5).", "hint": "Compute quintiles in a CTE, then keep quintile 1.", "solution": "WITH s AS (SELECT customer_id, SUM(amount) AS total FROM transactions GROUP BY customer_id), q AS (SELECT customer_id, total, NTILE(5) OVER (ORDER BY total DESC, customer_id) AS quintile FROM s) SELECT customer_id, ROUND(total,2) AS total FROM q WHERE quintile=1;"}, {"topic": "Date and time logic", "diff": "easy", "ordered": false, "ask": "I want to group by month shortly. First, add a clean year-month label to each transaction.", "prompt": "Return transaction_id and mth: the year-month of each transaction as text like 2024-05.", "hint": "strftime('%Y-%m', txn_date).", "solution": "SELECT transaction_id, strftime('%Y-%m', txn_date) AS mth FROM transactions;"}, {"topic": "Date and time logic", "diff": "medium", "ordered": true, "ask": "Give me the monthly revenue series, in order, so I can drop it straight into a chart.", "prompt": "Return mth and revenue: total revenue per calendar month rounded to 2 decimals, ordered by month.", "hint": "Group by the truncated month.", "solution": "SELECT strftime('%Y-%m', txn_date) AS mth, ROUND(SUM(amount),2) AS revenue FROM transactions GROUP BY 1 ORDER BY 1;"}, {"topic": "Date and time logic", "diff": "hard", "ordered": false, "ask": "For an activation-speed metric, how many days pass between signup and a customer's first transaction?", "prompt": "Return customer_id and days_to_first: the whole number of days from each customer's signup to their first transaction, for customers who transacted.", "hint": "MIN(txn_date) per customer, then julianday difference.", "solution": "WITH f AS (SELECT customer_id, MIN(txn_date) AS first_txn FROM transactions GROUP BY customer_id) SELECT c.customer_id, CAST(julianday(f.first_txn) - julianday(c.signup_date) AS INT) AS days_to_first FROM customers c JOIN f ON c.customer_id=f.customer_id;"}, {"topic": "Cohort retention", "diff": "medium", "ordered": false, "ask": "We think about customers by when they joined. Assign each customer to their signup-month cohort.", "prompt": "Return customer_id and cohort_month: each customer's signup cohort as year-month text.", "hint": "strftime on signup_date.", "solution": "SELECT customer_id, strftime('%Y-%m', signup_date) AS cohort_month FROM customers;"}, {"topic": "Cohort retention", "diff": "medium", "ordered": true, "ask": "How big is each signup cohort? I want the number of customers per joining month.", "prompt": "Return cohort_month and cohort_size: the number of customers in each signup-month cohort, ordered by month.", "hint": "Group customers by signup month.", "solution": "SELECT strftime('%Y-%m', signup_date) AS cohort_month, COUNT(*) AS cohort_size FROM customers GROUP BY 1 ORDER BY 1;"}, {"topic": "Cohort retention", "diff": "hard", "ordered": true, "ask": "This is the one leadership cares about. For each signup cohort, what share came back and transacted in the month right after they joined?", "prompt": "Return cohort_month, cohort_size, retained_m1 and retention_m1: for each signup cohort, its size, how many customers transacted in the month immediately after signup, and that retention rate rounded to 2 decimals. Order by cohort_month.", "hint": "Define next month per cohort, left join to distinct monthly activity, divide.", "solution": "WITH cohort AS (SELECT customer_id, strftime('%Y-%m', signup_date) AS cm, strftime('%Y-%m', date(signup_date,'start of month','+1 month')) AS next_m FROM customers), act AS (SELECT DISTINCT customer_id, strftime('%Y-%m', txn_date) AS tm FROM transactions) SELECT c.cm AS cohort_month, COUNT(DISTINCT c.customer_id) AS cohort_size, COUNT(DISTINCT a.customer_id) AS retained_m1, ROUND(COUNT(DISTINCT a.customer_id)*1.0/COUNT(DISTINCT c.customer_id),2) AS retention_m1 FROM cohort c LEFT JOIN act a ON a.customer_id=c.customer_id AND a.tm=c.next_m GROUP BY c.cm ORDER BY c.cm;"}, {"topic": "Funnel conversion and rate math", "diff": "medium", "ordered": false, "ask": "Walk me through our funnel. How many distinct customers reached each stage?", "prompt": "Return event_type and customers: the number of distinct customers who reached each funnel stage.", "hint": "Group events by type, count distinct customers.", "solution": "SELECT event_type, COUNT(DISTINCT customer_id) AS customers FROM events GROUP BY event_type;"}, {"topic": "Funnel conversion and rate math", "diff": "hard", "ordered": false, "ask": "Put the whole funnel on one row: signups, activated, first payment, and repeat payment, side by side.", "prompt": "In a single row return signups, activated, first_payment and repeat_payment: distinct customers at each stage, using conditional aggregation.", "hint": "COUNT(DISTINCT CASE WHEN event_type=... THEN customer_id END).", "solution": "SELECT COUNT(DISTINCT CASE WHEN event_type='signup' THEN customer_id END) AS signups, COUNT(DISTINCT CASE WHEN event_type='activated' THEN customer_id END) AS activated, COUNT(DISTINCT CASE WHEN event_type='first_payment' THEN customer_id END) AS first_payment, COUNT(DISTINCT CASE WHEN event_type='repeat_payment' THEN customer_id END) AS repeat_payment FROM events;"}, {"topic": "Funnel conversion and rate math", "diff": "hard", "ordered": false, "ask": "What is our activation rate, activated over signups? And make sure it does not break if signups were ever zero.", "prompt": "Return activation_rate: distinct activated customers divided by distinct signups, rounded to 3 decimals, protected against divide-by-zero.", "hint": "Use 1.0 multiplier and NULLIF on the denominator.", "solution": "SELECT ROUND(COUNT(DISTINCT CASE WHEN event_type='activated' THEN customer_id END) * 1.0 / NULLIF(COUNT(DISTINCT CASE WHEN event_type='signup' THEN customer_id END),0),3) AS activation_rate FROM events;"}, {"topic": "Cross-product attachment", "diff": "medium", "ordered": false, "ask": "For an attachment view, how many distinct products does each customer use?", "prompt": "Return customer_id and product_count: the number of distinct products each customer has transacted in.", "hint": "COUNT(DISTINCT product_id) per customer.", "solution": "SELECT customer_id, COUNT(DISTINCT product_id) AS product_count FROM transactions GROUP BY customer_id;"}, {"topic": "Cross-product attachment", "diff": "hard", "ordered": false, "ask": "Who are our most engaged customers by breadth? Show the ones using three or more products.", "prompt": "Return customer_id and product_count for customers who use 3 or more distinct products.", "hint": "HAVING on the distinct count.", "solution": "SELECT customer_id, COUNT(DISTINCT product_id) AS product_count FROM transactions GROUP BY customer_id HAVING COUNT(DISTINCT product_id) >= 3;"}, {"topic": "Cross-product attachment", "diff": "hard", "ordered": false, "ask": "Product wants to understand the Checkout to Credit relationship. Which customers use both?", "prompt": "Return customer_id for customers who use both Checkout (product_id 1) and Credit (product_id 3).", "hint": "Filter to those two products and require both are present.", "solution": "SELECT customer_id FROM transactions WHERE product_id IN (1,3) GROUP BY customer_id HAVING COUNT(DISTINCT product_id)=2;"}, {"topic": "Subtotals with ROLLUP", "diff": "hard", "ordered": false, "ask": "Give me revenue by segment, and include a grand total row so the numbers foot to the whole.", "prompt": "Return segment and revenue: rounded total revenue per customer segment, plus a final row labelled 'ALL' with the grand total.", "hint": "Group query UNION ALL a total query.", "solution": "SELECT c.segment AS segment, ROUND(SUM(t.amount),2) AS revenue FROM transactions t JOIN customers c ON t.customer_id=c.customer_id GROUP BY c.segment UNION ALL SELECT 'ALL', ROUND(SUM(amount),2) FROM transactions;"}, {"topic": "Subtotals with ROLLUP", "diff": "hard", "ordered": false, "ask": "Same idea for acquisition channel: revenue per channel, plus an overall total row.", "prompt": "Return acquisition_channel and revenue: rounded revenue per acquisition channel, plus an 'ALL' grand total row.", "hint": "Same UNION ALL subtotal pattern on channel.", "solution": "SELECT c.acquisition_channel AS acquisition_channel, ROUND(SUM(t.amount),2) AS revenue FROM transactions t JOIN customers c ON t.customer_id=c.customer_id GROUP BY c.acquisition_channel UNION ALL SELECT 'ALL', ROUND(SUM(amount),2) FROM transactions;"}, {"topic": "Subtotals with ROLLUP", "diff": "hard", "ordered": false, "ask": "For a one-page summary, stack revenue by segment and revenue by country into a single labelled result.", "prompt": "Return dim, value and revenue: revenue grouped by segment and, stacked below, revenue grouped by country, each row labelled with which dimension it came from.", "hint": "Two grouped queries combined with UNION ALL and a literal dim label.", "solution": "SELECT 'segment' AS dim, c.segment AS value, ROUND(SUM(t.amount),2) AS revenue FROM transactions t JOIN customers c ON t.customer_id=c.customer_id GROUP BY c.segment UNION ALL SELECT 'country', c.country, ROUND(SUM(t.amount),2) FROM transactions t JOIN customers c ON t.customer_id=c.customer_id GROUP BY c.country;"}, {"topic": "Causal setup treatment and control", "diff": "medium", "ordered": false, "ask": "We ran a campaign on the first of April. Label each transaction as pre or post that date.", "prompt": "Return transaction_id, txn_date and period: label each transaction 'pre' if before 2024-04-01, otherwise 'post'.", "hint": "CASE on txn_date against the campaign date.", "solution": "SELECT transaction_id, txn_date, CASE WHEN txn_date < '2024-04-01' THEN 'pre' ELSE 'post' END AS period FROM transactions;"}, {"topic": "Causal setup treatment and control", "diff": "hard", "ordered": false, "ask": "For the campaign readout, give me average spend for treatment versus control, before versus after. That is the core diff-in-differences table.", "prompt": "Return exp_group, period and avg_amount: average transaction amount for each experiment group and pre/post period, rounded to 2 decimals. This is the diff-in-differences 2 by 2.", "hint": "Join to campaign, group by group and a pre/post CASE.", "solution": "SELECT g.exp_group, CASE WHEN t.txn_date < '2024-04-01' THEN 'pre' ELSE 'post' END AS period, ROUND(AVG(t.amount),2) AS avg_amount FROM transactions t JOIN campaign g ON t.customer_id=g.customer_id GROUP BY g.exp_group, period;"}, {"topic": "Causal setup treatment and control", "diff": "hard", "ordered": false, "ask": "Build the base table a causal model would use: per customer, their group, and their spend before and after the campaign.", "prompt": "Return customer_id, exp_group, pre_amt and post_amt: per customer, their experiment group and their total spend before and after 2024-04-01, rounded to 2 decimals. Only customers with transactions.", "hint": "Conditional sums per customer in a CTE, joined to campaign.", "solution": "WITH p AS (SELECT customer_id, SUM(CASE WHEN txn_date < '2024-04-01' THEN amount ELSE 0 END) AS pre_amt, SUM(CASE WHEN txn_date >= '2024-04-01' THEN amount ELSE 0 END) AS post_amt FROM transactions GROUP BY customer_id) SELECT c.customer_id, g.exp_group, ROUND(p.pre_amt,2) AS pre_amt, ROUND(p.post_amt,2) AS post_amt FROM customers c JOIN campaign g ON c.customer_id=g.customer_id JOIN p ON p.customer_id=c.customer_id;"}];

let db=null, current=0;
const solved=new Set();

const SCHEMA_VIEW=[
 {name:"customers",cols:[["customer_id","int"],["first_name","text"],["country","text"],["segment","text"],["signup_date","date"],["acquisition_channel","text"]]},
 {name:"products",cols:[["product_id","int"],["product_name","text"],["category","text"]]},
 {name:"transactions",cols:[["transaction_id","int"],["customer_id","int"],["product_id","int"],["amount","real"],["status","text"],["txn_date","date"]]},
 {name:"events",cols:[["event_id","int"],["customer_id","int"],["event_type","text"],["event_date","date"]]},
 {name:"campaign",cols:[["customer_id","int"],["exp_group","text"]]},
];

function normCell(v){
  if(v===null||v===undefined) return "\u2205NULL";
  if(typeof v==="number") return (Math.round(v*100)/100).toFixed(2);
  return String(v).trim();
}
function runSQL(sql){const r=db.exec(sql);if(!r.length)return{columns:[],values:[]};return r[r.length-1];}
function rowsKey(res,ordered){const rows=res.values.map(r=>JSON.stringify(r.map(normCell)));if(!ordered)rows.sort();return rows;}
function grade(u,s,ordered){
  if(u.columns.length!==s.columns.length) return {ok:false,msg:"Expected "+s.columns.length+" column(s), your query returned "+u.columns.length+"."};
  if(u.values.length!==s.values.length) return {ok:false,msg:"Expected "+s.values.length+" row(s), your query returned "+u.values.length+"."};
  const a=rowsKey(u,ordered),b=rowsKey(s,ordered);
  for(let i=0;i<a.length;i++) if(a[i]!==b[i]) return {ok:false,msg:ordered?"Right count, but order or values differ. Check your ORDER BY and the values.":"Right shape, but some values do not match. Compare against the solution."};
  return {ok:true,msg:"Result matches the expected output."};
}

function topicIndices(topic){const out=[];QUESTIONS.forEach((q,i)=>{if(q.topic===topic)out.push(i);});return out;}
function topicDone(topic){return topicIndices(topic).filter(i=>solved.has(i)).length;}

function buildSidebar(){
  let html="";
  TOPICS.forEach((topic,ti)=>{
    const idxs=topicIndices(topic);
    html+='<div class="topic" data-topic="'+ti+'">';
    html+='<div class="topic-head"><span class="tname">'+(ti+1)+'. '+topic+'</span><span class="frac" id="frac-'+ti+'">0/'+idxs.length+'</span></div>';
    html+='<div class="tbar"><i id="tbar-'+ti+'"></i></div><div class="pad">';
    idxs.forEach(i=>{
      html+='<button class="qbtn" data-i="'+i+'"><span class="dot"></span><span class="lbl">'+QUESTIONS[i].prompt.slice(0,40)+(QUESTIONS[i].prompt.length>40?"...":"")+'</span></button>';
    });
    html+='</div></div>';
  });
  return html;
}
function buildMain(){
  return '<main>'
    +'<div class="qhead" id="qhead"></div>'

    +'<div class="lesson" id="lesson"><div class="lesson-head" id="lessonHead"><span class="lh" id="lessonTitle">Lesson</span><span class="chev" id="chev">hide</span></div><div class="lesson-body" id="lessonBody"></div></div>'

    +'<div class="editor-wrap"><div class="editor-bar"><span id="editorLabel">query.sql</span><button class="schema-toggle" id="schemaBtn">view schema</button></div><textarea id="sql" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea></div>'
    +'<div class="actions"><button class="act run" id="runBtn">Run and check</button><button class="act" id="solBtn">Show solution</button><button class="act" id="resetBtn">Clear</button><span class="kbd">Cmd / Ctrl + Enter</span></div>'

    +'<div class="results" id="resultsBox" style="display:none"><h3>Your result</h3><div class="tablescroll" id="tableScroll"></div><div class="rowcount" id="rowCount"></div></div>'

function buildSchema(){
  let html='<h3>Dataset schema</h3><p class="note">A simulated PayPal consumer-growth dataset: 60 customers across signup cohorts, a signup to repeat-payment event funnel, 140 transactions across five products, and a treatment/control campaign flag for causal work.</p><div class="tables">';
  SCHEMA_VIEW.forEach(t=>{html+='<div class="tbl"><div class="name">'+t.name+'</div><ul>';t.cols.forEach(c=>{html+='<li><b>'+c[0]+'</b><span class="ty">'+c[1]+'</span></li>';});html+='</ul></div>';});
  return html+'</div>';
}
function renderTable(res){
  if(!res.columns.length) return '<div style="padding:14px;color:var(--muted);font-family:var(--mono);font-size:12.5px">No columns returned.</div>';
  let h='<table><thead><tr>';res.columns.forEach(c=>h+='<th>'+c+'</th>');h+='</tr></thead><tbody>';
  res.values.slice(0,200).forEach(row=>{h+='<tr>';row.forEach(v=>{h+=(v===null||v===undefined)?'<td class="null">NULL</td>':'<td>'+String(v)+'</td>';});h+='</tr>';});
  return h+'</tbody></table>';
}

function updateTopic(topic){
  const ti=TOPICS.indexOf(topic);const idxs=topicIndices(topic);const done=topicDone(topic);
  const frac=document.getElementById("frac-"+ti);
  frac.textContent=done+"/"+idxs.length;frac.className="frac"+(done===idxs.length?" full":"");
  document.getElementById("tbar-"+ti).style.width=(done/idxs.length*100)+"%";
  if(document.getElementById("rtTitle") && QUESTIONS[current].topic===topic){
    setReadystrip(topic,done,idxs.length);
  }
}
function setReadystrip(topic,done,total){
  document.getElementById("rtTitle").innerHTML=topic+"<small>Topic "+(TOPICS.indexOf(topic)+1)+" of "+TOPICS.length+"</small>";
  document.getElementById("rbar").style.width=(done/total*100)+"%";
  const lab=document.getElementById("rlabel");
  if(done===0){lab.textContent="Not started";lab.className="rlabel";}
  else if(done<total){lab.textContent="In progress "+done+"/"+total;lab.className="rlabel prep";}
  else{lab.textContent="Ready \u2713";lab.className="rlabel ready";}
}
function updateProgress(){
  document.getElementById("doneCount").textContent=solved.size;
  document.getElementById("progBar").style.width=Math.round(solved.size/QUESTIONS.length*100)+"%";
}

function loadQuestion(i){
  current=i;const q=QUESTIONS[i];
  document.getElementById("qtick").textContent="Q"+(i+1);
  document.getElementById("qhead").innerHTML='<span class="pill '+q.diff+'">'+q.diff+'</span><span class="pill">'+q.topic+'</span><span class="cleared '+(solved.has(i)?"show":"")+'" id="clearedStamp">cleared</span>';
  document.getElementById("lessonBody").innerHTML=LESSONS[q.topic];
  document.getElementById("askText").textContent=q.ask;
  document.getElementById("promptText").textContent=q.prompt;
  document.getElementById("hint").innerHTML="<b>Hint:</b> "+q.hint;
  document.getElementById("sql").value="";
  document.getElementById("verdict").className="verdict";
  document.getElementById("resultsBox").style.display="none";
  document.getElementById("solution").className="solution";
  document.getElementById("solText").textContent=q.solution;
  const idxs=topicIndices(q.topic);setReadystrip(q.topic,topicDone(q.topic),idxs.length);
  document.querySelectorAll(".qbtn").forEach(b=>b.classList.toggle("active",+b.dataset.i===i));
  window.scrollTo({top:0,behavior:"smooth"});
  document.getElementById("sql").focus();
}
function markSolved(i){
  if(!solved.has(i)){
    solved.add(i);
    const btn=document.querySelector('.qbtn[data-i="'+i+'"]');
    if(btn){btn.classList.add("done");btn.querySelector(".dot").textContent="\u2713";}
    const st=document.getElementById("clearedStamp");if(st)st.classList.add("show");
    updateProgress();updateTopic(QUESTIONS[i].topic);
  }
}
function doRun(){
  const q=QUESTIONS[current];const sql=document.getElementById("sql").value.trim();
  const verdict=document.getElementById("verdict"),vic=document.getElementById("vic"),vmsg=document.getElementById("vmsg"),resultsBox=document.getElementById("resultsBox");
  if(!sql)return;
  let userRes;
  try{userRes=runSQL(sql);}catch(err){verdict.className="verdict no";vic.textContent="!";vmsg.textContent="SQL error: "+err.message;resultsBox.style.display="none";return;}
  resultsBox.style.display="block";
  document.getElementById("tableScroll").innerHTML=renderTable(userRes);
  const n=userRes.values.length;
  document.getElementById("rowCount").textContent=n+" row"+(n===1?"":"s")+" returned"+(n>200?" (showing first 200)":"");
  let solRes;try{solRes=runSQL(q.solution);}catch(e){solRes={columns:[],values:[]};}
  const g=grade(userRes,solRes,q.ordered);
  if(g.ok){verdict.className="verdict ok";vic.textContent="\u2713";vmsg.textContent=g.msg;markSolved(current);}
  else{verdict.className="verdict no";vic.textContent="\u2717";vmsg.textContent=g.msg;}
}

initSqlJs({locateFile:f=>"https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/"+f})
.then(SQL=>{
  db=new SQL.Database();db.run(SCHEMA_SQL);
  const app=document.getElementById("app");app.className="";
  app.innerHTML='<div class="wrap"><aside id="sidebar">'+buildSidebar()+'</aside>'+buildMain()+'</div>';
  document.getElementById("schema").innerHTML=buildSchema();
  document.getElementById("totalCount").textContent=QUESTIONS.length;
  document.querySelectorAll(".qbtn").forEach(b=>b.addEventListener("click",()=>loadQuestion(+b.dataset.i)));
  document.getElementById("runBtn").addEventListener("click",doRun);
  document.getElementById("solBtn").addEventListener("click",()=>document.getElementById("solution").classList.toggle("show"));
  document.getElementById("resetBtn").addEventListener("click",()=>{document.getElementById("sql").value="";document.getElementById("sql").focus();});
  document.getElementById("schemaBtn").addEventListener("click",()=>document.getElementById("schema").scrollIntoView({behavior:"smooth"}));
  const lh=document.getElementById("lessonHead");
  lh.addEventListener("click",()=>{const l=document.getElementById("lesson");l.classList.toggle("collapsed");document.getElementById("chev").textContent=l.classList.contains("collapsed")?"show":"hide";});
  const ta=document.getElementById("sql");
  ta.addEventListener("keydown",e=>{
    if((e.metaKey||e.ctrlKey)&&e.key==="Enter"){e.preventDefault();doRun();}
    if(e.key==="Tab"){e.preventDefault();const s=ta.selectionStart,en=ta.selectionEnd;ta.value=ta.value.slice(0,s)+"  "+ta.value.slice(en);ta.selectionStart=ta.selectionEnd=s+2;}
  });
  updateProgress();loadQuestion(0);
})
.catch(err=>{document.getElementById("app").innerHTML='<div class="loading">Could not load the SQL engine. Check your connection and reload. ('+err.message+')</div>';});
